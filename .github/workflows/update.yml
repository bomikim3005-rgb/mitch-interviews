# Refresh the data files the app reads, and commit them back so the deployed app
# (Streamlit Community Cloud) picks them up.
#
# - New press-conference videos come from the channel's RSS feed, which lists the
#   latest 15 videos; running twice a day keeps well within that.
# - Transcripts for the word cloud are NOT fetched here: YouTube asks GitHub's servers
#   to "sign in to confirm you're not a bot". They're fetched from a Mac instead.
#
# No secrets needed: everything it reads is public.
name: update

on:
  schedule:
    # 07:17 and 14:17 UTC = 11:17 pm and 6:17 am Pacific (PST): after the night's
    # post-game press conferences, and again for anything posted later.
    # GitHub may start it a few minutes late.
    - cron: "17 7,14 * * *"
    # Every 30 minutes, but the "Game window?" step stops the run straight away unless
    # a game tips off within the next hour or tipped off in the last 5 hours, so new
    # pre- and post-game videos show up on game nights within about half an hour.
    # Minutes 7 and 37 avoid the top and bottom of the hour, when GitHub is busiest
    # and delays scheduled runs the most.
    - cron: "7,37 * * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs

concurrency:
  group: update             # never two runs at once
  cancel-in-progress: false

permissions:
  contents: write           # to commit the refreshed data files

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Game window?
        id: gate
        # Only the every-30-minutes schedule is gated; the twice-daily runs and manual
        # runs always go ahead. Uses tip-off times from interviews.csv (standard library only).
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" != "7,37 * * * *" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          hit = None
          for row in csv.DictReader(open("interviews.csv", newline="")):
              t = row.get("tipoff_utc") or ""
              if not t:
                  continue
              tip = datetime.fromisoformat(t.replace("Z", "+00:00"))
              if tip - timedelta(hours=1) <= now <= tip + timedelta(hours=5):
                  hit = row
                  break
          import sys
          print(f"In window: {hit['date']} {hit['game']}" if hit else "No game window now.", file=sys.stderr)
          print(f"run={'true' if hit else 'false'}")
          PY

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-pipeline.txt

      - name: Update data
        if: steps.gate.outputs.run == 'true'
        # Transcripts are skipped here: YouTube's bot check blocks caption downloads
        # from GitHub's servers. Fetch them on a Mac (python update.py) and push.
        run: python update.py --skip-transcripts

      - name: Commit changes
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.csv interviews.csv venues.csv arenas.csv preseason.csv standings.csv transcripts
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data ($(date -u +%Y-%m-%dT%H:%MZ))"
            # The Mac's transcript job pushes too; take its commits first.
            git pull --rebase
            git push
          fi
